<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon as Silver Cathode in Galvanic Cell</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 2rem;
    }
    
    .header-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    
    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #a78bfa;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-left: 1.75rem;
    }
    
    .diagram-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1.5rem;
      overflow-x: auto;
    }
    
    svg {
      width: 100%;
      min-width: 800px;
      display: block;
    }
    
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #475569;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Moon as Silver Cathode in Galvanic Cell</h1>
      </div>
      <p class="subtitle">Cheryl K. Beggs | Moon in Virgo (Earth Sign)</p>
    </div>

    <!-- Main Diagram -->
    <div class="diagram-container">
      <svg viewBox="0 0 1000 600">
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Galvanic Cell Boundary -->
        <rect x="100" y="100" width="800" height="400" rx="12" fill="rgba(15, 23, 42, 0.3)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="110" y="120" fill="#fbbf24" font-size="10" font-weight="600">Galvanic Cell: Your Cosmic Battery</text>

        <!-- Sun (Gold Anode) -->
        <circle cx="250" cy="250" r="40" fill="rgba(255, 215, 0, 0.4)" stroke="#fbbf24" stroke-width="2"/>
        <text x="250" y="250" fill="white" font-size="14" font-weight="600" text-anchor="middle">☉ Sun</text>
        <text x="250" y="275" fill="#fbbf24" font-size="10" text-anchor="middle">Gold Anode</text>
        <text x="250" y="290" fill="#94a3b8" font-size="9" text-anchor="middle">(Oxidation)</text>
        <text x="250" y="305" fill="#94a3b8" font-size="9" text-anchor="middle">Taurus 12°</text>

        <!-- Moon (Silver Cathode) -->
        <circle cx="750" cy="250" r="40" fill="rgba(192, 192, 192, 0.4)" stroke="#a78bfa" stroke-width="2"/>
        <text x="750" y="250" fill="white" font-size="14" font-weight="600" text-anchor="middle">☽ Moon</text>
        <text x="750" y="275" fill="#a78bfa" font-size="10" text-anchor="middle">Silver Cathode</text>
        <text x="750" y="290" fill="#94a3b8" font-size="9" text-anchor="middle">(Reduction)</text>
        <text x="750" y="305" fill="#94a3b8" font-size="9" text-anchor="middle">Virgo 9°</text>

        <!-- Earth (Salt Bridge) -->
        <rect x="480" y="320" width="40" height="60" rx="6" fill="rgba(139, 69, 19, 0.3)" stroke="#34d399" stroke-width="1.5"/>
        <text x="500" y="345" fill="white" font-size="10" font-weight="600" text-anchor="middle">Earth</text>
        <text x="500" y="360" fill="#34d399" font-size="8" text-anchor="middle">Salt Bridge</text>

        <!-- Electron Flow (Current) -->
        <path d="M 290 250 Q 500 200 710 250" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="500" y="180" fill="#22d3ee" font-size="10" font-weight="600">Electron Flow</text>
        <text x="500" y="195" fill="#94a3b8" font-size="8">(Life Energy)</text>

        <!-- Planets as Electrodes (Modulating the Current) -->
        <circle cx="350" cy="200" r="15" fill="rgba(184, 115, 51, 0.5)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="350" y="190" fill="white" font-size="10" text-anchor="middle">♄</text>
        <text x="350" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">Saturn (Lead)</text>

        <circle cx="400" cy="180" r="15" fill="rgba(224, 204, 169, 0.5)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="400" y="170" fill="white" font-size="10" text-anchor="middle">♃</text>
        <text x="400" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">Jupiter (Tin)</text>

        <circle cx="650" cy="180" r="15" fill="rgba(192, 192, 192, 0.5)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="650" y="170" fill="white" font-size="10" text-anchor="middle">♀</text>
        <text x="650" y="200" fill="#94a3b8" font-size="8" text-anchor="middle">Venus (Copper)</text>

        <circle cx="700" cy="200" r="15" fill="rgba(200, 200, 200, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="700" y="190" fill="white" font-size="10" text-anchor="middle">☿</text>
        <text x="700" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">Mercury (Mercury)</text>

        <!-- Virgo Moon Details -->
        <rect x="600" y="350" width="300" height="120" rx="8" fill="rgba(15, 23, 42, 0.5)" stroke="#a78bfa" stroke-width="1"/>
        <text x="750" y="370" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">Virgo Moon: High-Precision Cathode</text>
        <text x="750" y="385" fill="#94a3b8" font-size="9" text-anchor="middle">• Filters solar energy into analytical emotions</text>
        <text x="750" y="400" fill="#94a3b8" font-size="9" text-anchor="middle">• Creates strong circuit with Mercury (Virgo's ruler)</text>
        <text x="750" y="415" fill="#94a3b8" font-size="9" text-anchor="middle">• Earth sign = stable, grounded emotional processing</text>
        <text x="750" y="435" fill="#34d399" font-size="9" text-anchor="middle">Cheryl's Moon: "I feel, therefore I analyze"</text>

        <!-- Legend -->
        <text x="800" y="50" fill="white" font-size="10" font-weight="600">Legend</text>
        <circle cx="800" cy="70" r="8" fill="rgba(255, 215, 0, 0.4)" stroke="#fbbf24" stroke-width="1"/>
        <text x="820" y="75" fill="#94a3b8" font-size="8">Sun (Gold Anode)</text>

        <circle cx="800" cy="90" r="8" fill="rgba(192, 192, 192, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="820" y="95" fill="#94a3b8" font-size="8">Moon (Silver Cathode)</text>

        <rect x="800" y="105" width="16" height="10" rx="2" fill="rgba(139, 69, 19, 0.3)" stroke="#34d399" stroke-width="1"/>
        <text x="820" y="113" fill="#94a3b8" font-size="8">Earth (Salt Bridge)</text>

        <path d="M 800 125 L 816 125" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="820" y="130" fill="#94a3b8" font-size="8">Electron Flow</text>
      </svg>
    </div>

    <!-- Footer -->
    <p class="footer">
      SkyCLAWk Cosmic Model • Galvanic Cell Framework
    </p>
  </div>
</body>
</html>
